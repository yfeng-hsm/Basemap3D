[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basemap3d"
version = "0.4.0"
description = "Interactive 3D maps in Python with city models, terrain and thematic layers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["shapely>=2,<3", "pyproj>=3.6,<4"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "ipython>=8,<10"]

[tool.setuptools.packages.find]
include = ["basemap3d*"]

[tool.setuptools.package-data]
basemap3d = ["assets/*.html", "assets/*.css", "assets/*.js"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basemapde-wrapper"
version = "0.2.0"
description = "A Folium-style Python wrapper for a five-step CesiumJS urban GIS exercise"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["shapely>=2,<3"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "ipython>=8,<10"]

[tool.setuptools.packages.find]
include = ["basemapde*"]

[tool.setuptools.package-data]
basemapde = ["assets/*.html", "assets/*.css", "assets/*.js"]
